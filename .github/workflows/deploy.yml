name: Deploy Plugin to Staging

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat >> ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Deploy via rsync
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          PLUGIN_PATH: ${{ secrets.PLUGIN_PATH }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
        run: |
          set -euo pipefail
          rsync -avz --delete \
            -e "ssh -p $STAGING_PORT -i ~/.ssh/id_ed25519" \
            ./ "$STAGING_USER@$SSH_HOST:$PLUGIN_PATH"

      - name: Clear cache / optional
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          PLUGIN_PATH: ${{ secrets.PLUGIN_PATH }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
              -p "$STAGING_PORT" \
              "$STAGING_USER@$SSH_HOST" \
              "cd '$PLUGIN_PATH' && pwd"
