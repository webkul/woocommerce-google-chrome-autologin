name: Deploy Plugin to Staging

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Fail clearly if secrets are missing/empty
          test -n "${{ secrets.SSH_HOST }}"
          test -n "${{ secrets.STAGING_USER }}"
          test -n "${{ secrets.PLUGIN_PATH }}"
          test -n "${{ secrets.STAGING_PORT }}"

          # Add server host key to known_hosts (uses your configured port)
          ssh-keyscan -p "${{ secrets.STAGING_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        shell: bash
        run: |
          set -euo pipefail
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.STAGING_PORT }}" \
            ./ "${{ secrets.STAGING_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PLUGIN_PATH }}"

      - name: Clear cache / optional
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.STAGING_PORT }}" "${{ secrets.STAGING_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.PLUGIN_PATH }}' && pwd"
