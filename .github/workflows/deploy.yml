name: Deploy Plugin to Staging

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write key (handle secrets that may have lost newlines)
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Verify key is valid before proceeding
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || {
            echo "::error::SSH key is invalid or malformed"
            exit 1
          }

          # Add host to known_hosts (with timeout to catch unreachable servers)
          ssh-keyscan -T 10 -p "$STAGING_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>&1 || {
            echo "::error::Cannot reach $SSH_HOST:$STAGING_PORT — check firewall rules"
            exit 1
          }

      - name: Deploy via rsync
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          PLUGIN_PATH: ${{ secrets.PLUGIN_PATH }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
        run: |
          set -euo pipefail
          rsync -avz --delete \
            -e "ssh -p $STAGING_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./ "$STAGING_USER@$SSH_HOST:$PLUGIN_PATH"

      - name: Clear cache / optional
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          PLUGIN_PATH: ${{ secrets.PLUGIN_PATH }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
              -p "$STAGING_PORT" \
              -o StrictHostKeyChecking=no \
              "$STAGING_USER@$SSH_HOST" \
              "cd '$PLUGIN_PATH' && pwd"
